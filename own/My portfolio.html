<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <title>MY Portfolio</title>
        </head>
        <body>
            <h1>MY Portfolio</h1>
            <img src="my pic.jpeg" width="200px" height="200px" style="border-radius: 50%;">
            <form >
                <fieldset>
                    <legend>
                        personal Information
                    </legend>
                    <table> <tr>
                        <td><label for="Name">Name:</label></td>
                        <td><input type="text" for="Name" id="Name" name="Name"placeholder="Enter your Name"></td>
                    </tr><br>
                    <tr>
                        <td> <label for="id">ID:</label></td>
                        <td><input type="number"for="id" id="id" name="id" placeholder="Enter your id "></td>
                    
                    </tr><br>
                    <tr>
                        <td><label for="Gender">Gender</label></td>
                        <td><input type="radio" for="Gender"name="Gender" id="Gender">Male
                         <input type="radio" for="Gender"name="Gender" id="Gender">Female</td>

                    </tr>
                     <tr>
                        <td> <label for="age">AGE:</label></td>
                        <td><input type="number"for="age" id="age" name="age" placeholder="Enter your Age "></td>
                    
                    </tr><br>
                    
                    <tr>
                        <td><label for="CGPA">CGPA:</label></td>
                        <td><input type="number" for="CGPA" id="CGPA" name="CGPA" placeholder="Enter your CGPA"></td>
                    </tr>
                    <tr>
                        <td><label for="number">PHONE NAMBER:</label></td>
                        <td><input type="number" for="number"id="number"name="number"placeholder="Enter your phone Number"required></td>
                    </tr>

</table>
                   
                </fieldset>

<br><br>
                <fieldset>
                    <legend>More Information</legend>
                    <table>
                        <tr><td>
                            <label for="DOB">DOB</label>
                        </td>
                    <td><input type="date" for="DOB" id="DOB" name="DOB"></td>
                        </tr>
                    
                    
                    </tr>
                        <tr>
                            <td><label for="Email">Email:</label></td>
                            <td><input type="email" id="Email" name="Email" placeholder="Enter your Email"required></td>
                        </tr>

                        <tr>
                            <td><label for="Citizenship">Citizenship</label></td>
                            <td>
                             <select>
                                <option id="blank">-------</option>
                                <option id="BD">Bangladesh</option>
                                <option id="USA">USA</option>
                                <option id="CAN">CANADA</option>
                                
                             </select>
                            </td>
                        </tr>
                        <tr><td><label for="Address">ADDRESS</label></td>
                        <td><textarea for="Address" id="Address" name="Address" rows="10"cols="30" style="resize: none;"></textarea></td>
                        
                        </tr>
                      
                    </table>
                </fieldset>
                  <br>
                        <br>
                    <fieldset>
                        <legend>other Information</legend>
                        <h1>HOBBY</h1>
                        <table>
                            <tr>
                                <td><label for="HOBBY">HOBBYS</label></td>
                                <td>
                                    <select >
                                        <option id="none">-------</option>
                                        <option id="PLA">PLAYING</option>
                                        <option id="RED">READING</option>
                                        <option id="out">others</option>
                                    </select>
                                </td>
                            </tr>
                        </table>

                    </fieldset>
            </form>
        </body>
    
</html>
