            <form >
                <fieldset>
                    <legend>
                        personal Information

                    <table> <tr>

                    </tr>

                    <tr>

                    </tr>

                    </tr>

</table>
                   
                </fieldset>

<br><br>

                        </tr>
                    
                    
                    </tr>

                        </tr>

                        </tr>
